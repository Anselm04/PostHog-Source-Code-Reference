name: Preserve original upstream workflow code without executing it
on:
  push:
    paths:
      - '.github/workflows/archive-upstream-ci-once.yml'
permissions:
  contents: write
jobs:
  archive:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-inert-ci-archive.yml@main
    with:
      upstream_url: https://github.com/PostHog/posthog.git
      upstream_sha: a081bda2be64e0520cec834fab22e1d66a670864
      archive_slug: posthog
