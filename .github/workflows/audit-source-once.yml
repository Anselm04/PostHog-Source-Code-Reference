name: One-time pinned posthog source identity audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/PostHog/posthog.git
      upstream_sha: a081bda2be64e0520cec834fab22e1d66a670864
      audit_slug: posthog
